[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["registry_server", "registry_store"]

[project]
name = "a2a-registry-server"
version = "0.1.0"
description = "FastAPI-based AI Agent Registry Server using Google A2A protocol"
requires-python = ">=3.10"
authors = [
  { name = "Chenguang Yang", email = "frankycg@alumni.stanford.edu" }
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
  "python-a2a>=0.1.0",
  "gunicorn>=22.0.0",
  "google-cloud-firestore>=2.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[project.scripts]
a2a-registry-server = "registry_server:app"
